<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password - Job Board Connect</title>

    <link rel="icon" type="image/jpg" href="../assets/images/nip-favicon.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="../assets/vendors/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/vendors/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">

    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: #f8f9fa;
        }

        .login-card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="login-card p-5">

                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-primary mb-2">Forgot Password?</h2>
                            <p class="text-muted">Enter your email and we'll send you a link to reset your password.</p>
                        </div>

                        <form>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control form-control-lg" placeholder="your@email.com"
                                    required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Send Reset Link</button>

                            <div class="text-center">
                                <a href="login.html" class="text-primary text-decoration-none fw-semibold">Back to
                                    Login</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/vendors/bootstrap/bootstrap.bundle.min.js"></script>
</body>

</html>
