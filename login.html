<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - Job Board Connect</title>

    <link rel="icon" type="image/jpg" href="../assets/images/nip-favicon.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="../assets/vendors/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/vendors/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">

    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
        }

        .login-card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="login-card p-5">

                        <!-- Logo -->
                        <div class="text-center mb-4">
                            <a href="index.html" class="text-decoration-none">
                                <h2 class="fw-bold text-primary mb-2">
                                    <i class="bi bi-briefcase-fill me-2"></i>Job Board Connect
                                </h2>
                            </a>
                            <p class="text-muted">Sign in to your account</p>
                        </div>

                        <!-- Login Form -->
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control form-control-lg" placeholder="your@email.com"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control form-control-lg"
                                    placeholder="Enter your password" required>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label" for="remember">Remember me</label>
                                </div>
                                <a href="#" class="text-primary text-decoration-none">Forgot Password?</a>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                            </button>

                            <div class="text-center">
                                <p class="mb-0">Don't have an account? <a href="#"
                                        class="text-primary text-decoration-none fw-semibold">Sign Up</a></p>
                            </div>
                        </form>

                        <!-- Divider -->
                        <div class="position-relative my-4">
                            <hr>
                            <span
                                class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted">or</span>
                        </div>

                        <!-- Social Login -->
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-outline-dark btn-lg">
                                <i class="bi bi-google me-2"></i>Continue with Google
                            </button>
                            <button type="button" class="btn btn-outline-dark btn-lg">
                                <i class="bi bi-linkedin me-2"></i>Continue with LinkedIn
                            </button>
                        </div>

                        <!-- Back to Home -->
                        <div class="text-center mt-4">
                            <a href="index.html" class="text-decoration-none text-muted">
                                <i class="bi bi-arrow-left me-1"></i>Back to Home
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/vendors/bootstrap/bootstrap.bundle.min.js"></script>
</body>

</html>
